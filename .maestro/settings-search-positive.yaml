appId: com.android.settings
---
- launchApp:
    clearState: true

# Open Settings search
- tapOn:
    id: "com.android.settings:id/search_action_bar"

# Search for Battery settings
- inputText: "Battery"

# Submit search using keyboard
- pressKey: Enter

# Verify search result
- assertVisible: "Battery"

# Open Battery settings from search results
- tapOn: "Battery"

# Verify Battery settings screen
- assertVisible: "Battery Saver"