appId: com.android.settings
---
- launchApp
- scrollUntilVisible:
    element:
      text: "Display & touch"
    direction: DOWN
- assertVisible: "Display & touch"
- tapOn: "Display & touch"
- assertVisible: "Dark theme"

# Initial state: Dark theme is disabled
- assertVisible:
    id: "com.android.settings:id/switchWidget"
    text: "Dark theme"
    checked: false

# Enable Dark theme
- tapOn:
    id: "com.android.settings:id/switchWidget"
    index: 0

# Verify Dark theme is enabled
- assertVisible:
    id: "com.android.settings:id/switchWidget"
    text: "Dark theme"
    checked: true

# Disable Dark theme
- tapOn:
    id: "com.android.settings:id/switchWidget"
    index: 0

# Verify Dark theme is disabled again
- assertVisible:
    id: "com.android.settings:id/switchWidget"
    text: "Dark theme"
    checked: false
