appId: com.android.settings
---
- launchApp
- assertVisible: "Display & touch"
- tapOn: "Display & touch"
- assertVisible: "Dark theme"

# Başlangıç: Dark theme kapalı
- assertVisible:
    id: "com.android.settings:id/switchWidget"
    text: "Dark theme"
    checked: false

# Dark theme aç
- tapOn:
    id: "com.android.settings:id/switchWidget"
    index: 0

# Dark theme açık mı?
- assertVisible:
    id: "com.android.settings:id/switchWidget"
    text: "Dark theme"
    checked: true

# Dark theme kapat
- tapOn:
    id: "com.android.settings:id/switchWidget"
    index: 0

# Dark theme tekrar kapalı mı?
- assertVisible:
    id: "com.android.settings:id/switchWidget"
    text: "Dark theme"
    checked: false
